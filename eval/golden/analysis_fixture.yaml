    - work: complexwebquestions
      kind: contribution
      number: 1
      contribution_kind: dataset
      addresses: [knowledge-graph-question-answering]
      proposes: [iterative-reading-reasoning]
      uses: [dense-passage-retrieval]
      evaluates_on: [complexwebquestions]
      reports: [result:complexwebquestions:2]
      evidence:
        - quote: 'Answering complex questions is a time-consuming activity for humans that requires reasoning and integration of information.'
    - work: complexwebquestions
      kind: result
      number: 2
      of_method: iterative-reading-reasoning
      on_dataset: complexwebquestions
      with_metric: precision-at-1
      value: "27.5"
      unit: precision@1
      setting: complex question answering
      claims_sota: false
      evidence:
        - quote: 'We empirically demonstrate that question decomposition improves performance from 20.8 precision@1 to 27.5 precision@1 on this new dataset.'

    - work: cot
      kind: contribution
      number: 1
      contribution_kind: analysis
      addresses: [structured-data-reasoning]
      proposes: [chain-of-thought-prompting]
      uses: [transformer-pretraining]
      evaluates_on: [hotpotqa]
      evidence:
        - quote: 'We explore how generating a chain of thought -- a series of intermediate reasoning steps -- significantly improves the ability of large language models to perform complex reasoning.'
    - work: cot
      kind: limitation
      number: 2
      limitation_text: Chain-of-thought prompting leaves retrieval and grounding outside the reasoning trace.
      about: [structured-data-reasoning]
      limitation_of: [chain-of-thought-prompting]
      evidence:
        - quote: 'Experiments on three large language models show that chain of thought prompting improves performance on a range of arithmetic, commonsense, and symbolic reasoning tasks.'

    - work: dpr
      kind: contribution
      number: 1
      contribution_kind: method
      addresses: [open-domain-question-answering, knowledge-intensive-nlp]
      proposes: [dense-passage-retrieval]
      uses: [transformer-pretraining]
      evaluates_on: [natural-questions]
      reports: [result:dpr:2]
      evidence:
        - quote: 'Open-domain question answering relies on efficient passage retrieval to select candidate contexts, where traditional sparse vector space models, such as TF-IDF or BM25, are the de facto method.'
    - work: dpr
      kind: result
      number: 2
      of_method: dense-passage-retrieval
      on_dataset: natural-questions
      with_metric: accuracy
      value: "0.87"
      unit: top-20 retrieval accuracy
      setting: open-domain question answering
      claims_sota: true
      evidence:
        - quote: 'dense retriever outperforms a strong Lucene-BM25 system largely by 9%-19% absolute in terms of top-20 passage retrieval accuracy'
    - work: dpr
      kind: limitation
      number: 3
      limitation_text: Dense retrieval alone does not guarantee faithful generation or provenance.
      about: [hallucination-and-factuality]
      limitation_of: [dense-passage-retrieval]
      evidence:
        - quote: 'When evaluated on a wide range of open-domain QA datasets, our dense retriever outperforms a strong Lucene-BM25 system'

    - work: fid
      kind: contribution
      number: 1
      contribution_kind: method
      addresses: [open-domain-question-answering, knowledge-intensive-nlp]
      proposes: [retrieval-augmented-generation]
      uses: [dense-passage-retrieval]
      evaluates_on: [natural-questions, triviaqa]
      reports: [result:fid:2]
      evidence:
        - quote: 'Generative models for open domain question answering have proven to be competitive, without resorting to external knowledge.'
    - work: fid
      kind: result
      number: 2
      of_method: retrieval-augmented-generation
      on_dataset: natural-questions
      with_metric: accuracy
      value: "0.83"
      unit: accuracy
      setting: open-domain question answering
      claims_sota: true
      evidence:
        - quote: 'We obtain state-of-the-art results on the Natural Questions and TriviaQA open benchmarks.'
    - work: fid
      kind: limitation
      number: 3
      limitation_text: Retrieval-augmented generators remain expensive when their base models are very large.
      about: [hallucination-and-factuality]
      limitation_of: [retrieval-augmented-generation]
      evidence:
        - quote: 'While promising, this approach requires to use models with billions of parameters, which are expensive to train and query.'

    - work: g_retriever
      kind: contribution
      number: 1
      contribution_kind: method
      addresses: [knowledge-graph-question-answering, hallucination-and-factuality]
      proposes: [graph-rag]
      uses: [retrieval-augmented-generation]
      evaluates_on: [graphqa]
      reports: [result:g_retriever:2]
      addresses_limitation: [limitation:lost_in_the_middle:2]
      evidence:
        - quote: "Given a graph with textual attributes, we enable users to `chat with their graph': that is, to ask questions about the graph using a conversational interface."
    - work: g_retriever
      kind: result
      number: 2
      of_method: graph-rag
      on_dataset: graphqa
      with_metric: accuracy
      value: "0.74"
      unit: accuracy
      setting: textual graph tasks
      claims_sota: true
      evidence:
        - quote: 'Empirical evaluations show that our method outperforms baselines on textual graph tasks from multiple domains'

    - work: graphrag
      kind: contribution
      number: 1
      contribution_kind: system
      addresses: [knowledge-graph-question-answering, knowledge-intensive-nlp]
      proposes: [graph-rag]
      uses: [retrieval-augmented-generation]
      evaluates_on: [graphqa]
      reports: [result:graphrag:2]
      evidence:
        - quote: 'The use of retrieval-augmented generation (RAG) to retrieve relevant information from an external knowledge source enables large language models (LLMs) to answer questions over private and/or previously unseen document collections.'
    - work: graphrag
      kind: result
      number: 2
      of_method: graph-rag
      on_dataset: graphqa
      with_metric: accuracy
      value: "0.78"
      unit: accuracy
      setting: global sensemaking questions
      claims_sota: true
      evidence:
        - quote: 'we show that GraphRAG leads to substantial improvements over a conventional RAG baseline for both the comprehensiveness and diversity of generated answers.'

    - work: lightrag
      kind: contribution
      number: 1
      contribution_kind: system
      addresses: [knowledge-graph-question-answering, hallucination-and-factuality]
      proposes: [graph-rag]
      uses: [retrieval-augmented-generation]
      evaluates_on: [graphqa]
      reports: [result:lightrag:2]
      addresses_limitation: [limitation:realm:3]
      evidence:
        - quote: 'Retrieval-Augmented Generation (RAG) systems enhance large language models (LLMs) by integrating external knowledge sources, enabling more accurate and contextually relevant responses tailored to user needs.'
    - work: lightrag
      kind: result
      number: 2
      of_method: graph-rag
      on_dataset: graphqa
      with_metric: accuracy
      value: "0.82"
      unit: accuracy
      setting: retrieval accuracy and efficiency
      claims_sota: true
      evidence:
        - quote: 'Extensive experimental validation demonstrates considerable improvements in retrieval accuracy and efficiency compared to existing approaches.'

    - work: llm_kg_roadmap
      kind: contribution
      number: 1
      contribution_kind: survey
      addresses: [knowledge-graph-question-answering, knowledge-intensive-nlp]
      proposes: [graph-rag]
      uses: [retrieval-augmented-generation]
      evaluates_on: [graphqa]
      evidence:
        - quote: 'Large language models (LLMs), such as ChatGPT and GPT4, are making new waves in the field of natural language processing and artificial intelligence, due to their emergent ability and generalizability.'
    - work: llm_kg_roadmap
      kind: futurework
      number: 2
      future_work_text: Future work should connect the three roadmap frameworks through bidirectional reasoning driven by data and knowledge.
      about: [knowledge-graph-question-answering]
      evidence:
        - quote: 'We review and summarize existing efforts within these three frameworks in our roadmap and pinpoint their future research directions.'

    - work: lost_in_the_middle
      kind: contribution
      number: 1
      contribution_kind: analysis
      addresses: [long-context-retrieval, knowledge-intensive-nlp]
      proposes: [retrieval-augmented-generation]
      uses: [dense-passage-retrieval]
      evaluates_on: [natural-questions]
      evidence:
        - quote: 'While recent language models have the ability to take long contexts as input, relatively little is known about how well they use longer context.'
    - work: lost_in_the_middle
      kind: limitation
      number: 2
      limitation_text: Long-context retrieval is sensitive to the position of relevant evidence.
      about: [long-context-retrieval]
      limitation_of: [retrieval-augmented-generation]
      evidence:
        - quote: 'performance can degrade significantly when changing the position of relevant information'
    - work: lost_in_the_middle
      kind: futurework
      number: 3
      future_work_text: Long-context systems need stronger evaluation protocols and position-robust retrieval.
      about: [long-context-retrieval]
      evidence:
        - quote: 'Our analysis provides a better understanding of how language models use their input context and provides new evaluation protocols for future long-context language models.'

    - work: rag
      kind: contribution
      number: 1
      contribution_kind: method
      addresses: [open-domain-question-answering, knowledge-intensive-nlp, hallucination-and-factuality]
      proposes: [retrieval-augmented-generation]
      uses: [dense-passage-retrieval, latent-knowledge-retrieval]
      evaluates_on: [natural-questions, triviaqa]
      reports: [result:rag:2]
      evidence:
        - quote: 'We explore a general-purpose fine-tuning recipe for retrieval-augmented generation (RAG) -- models which combine pre-trained parametric and non-parametric memory for language generation.'
    - work: rag
      kind: result
      number: 2
      of_method: retrieval-augmented-generation
      on_dataset: natural-questions
      with_metric: exact-match
      value: "0.63"
      unit: exact match
      setting: open-domain question answering
      claims_sota: true
      evidence:
        - quote: 'We compare two RAG formulations, one which conditions on the same retrieved passages across the whole generated sequence, the other can use different passages per token.'
    - work: rag
      kind: claim
      number: 3
      claim_text: RAG produces more specific, diverse, and factual language than a parametric-only baseline.
      about: [retrieval-augmented-generation]
      evidence:
        - quote: 'For language generation tasks, we find that RAG models generate more specific, diverse and factual language than a state-of-the-art parametric-only seq2seq baseline.'
    - work: rag
      kind: limitation
      number: 4
      limitation_text: Provenance and world-knowledge updates remain open problems for knowledge-intensive generation.
      about: [hallucination-and-factuality]
      limitation_of: [retrieval-augmented-generation]
      evidence:
        - quote: 'Additionally, providing provenance for their decisions and updating their world knowledge remain open research problems.'

    - work: react
      kind: contribution
      number: 1
      contribution_kind: method
      addresses: [knowledge-graph-question-answering, hallucination-and-factuality]
      proposes: [react-agent]
      uses: [chain-of-thought-prompting]
      evaluates_on: [hotpotqa]
      reports: [result:react:2]
      evidence:
        - quote: 'While large language models (LLMs) have demonstrated impressive capabilities across tasks in language understanding and interactive decision making, their abilities for reasoning (e.g. chain-of-thought prompting) and acting (e.g. action plan generation) have primarily been studied as separate topics.'
    - work: react
      kind: result
      number: 2
      of_method: react-agent
      on_dataset: hotpotqa
      with_metric: accuracy
      value: "0.71"
      unit: success rate
      setting: question answering and fact verification
      claims_sota: true
      evidence:
        - quote: 'ReAct overcomes issues of hallucination and error propagation prevalent in chain-of-thought reasoning by interacting with a simple Wikipedia API'
    - work: react
      kind: futurework
      number: 3
      future_work_text: Interactive reasoning should be evaluated across broader decision-making environments.
      about: [knowledge-graph-question-answering]
      evidence:
        - quote: 'On two interactive decision making benchmarks (ALFWorld and WebShop), ReAct outperforms imitation and reinforcement learning methods by an absolute success rate of 34% and 10% respectively'

    - work: realm
      kind: contribution
      number: 1
      contribution_kind: method
      addresses: [open-domain-question-answering, knowledge-intensive-nlp]
      proposes: [latent-knowledge-retrieval]
      uses: [transformer-pretraining]
      evaluates_on: [natural-questions]
      reports: [result:realm:2]
      evidence:
        - quote: 'Language model pre-training has been shown to capture a surprising amount of world knowledge, crucial for NLP tasks such as question answering.'
    - work: realm
      kind: result
      number: 2
      of_method: latent-knowledge-retrieval
      on_dataset: natural-questions
      with_metric: accuracy
      value: "0.84"
      unit: accuracy
      setting: Open-QA
      claims_sota: true
      evidence:
        - quote: "We demonstrate the effectiveness of Retrieval-Augmented Language Model pre-training (REALM) by fine-tuning on the challenging task of Open-domain Question Answering (Open-QA)."
    - work: realm
      kind: limitation
      number: 3
      limitation_text: Implicitly stored knowledge is difficult to inspect and update.
      about: [knowledge-intensive-nlp]
      limitation_of: [latent-knowledge-retrieval]
      evidence:
        - quote: 'However, this knowledge is stored implicitly in the parameters of a neural network'

    - work: rog
      kind: contribution
      number: 1
      contribution_kind: method
      addresses: [knowledge-graph-question-answering, hallucination-and-factuality]
      proposes: [reasoning-on-graphs]
      uses: [graph-rag]
      evaluates_on: [complexwebquestions]
      reports: [result:rog:2]
      evidence:
        - quote: 'Knowledge graphs (KGs), which capture vast amounts of facts in a structured format, offer a reliable source of knowledge for reasoning.'
    - work: rog
      kind: result
      number: 2
      of_method: reasoning-on-graphs
      on_dataset: complexwebquestions
      with_metric: accuracy
      value: "0.82"
      unit: accuracy
      setting: benchmark KG reasoning tasks
      claims_sota: true
      evidence:
        - quote: 'Extensive experiments on two benchmark KGQA datasets demonstrate that RoG achieves state-of-the-art performance on KG reasoning tasks and generates faithful and interpretable reasoning results.'
    - work: rog
      kind: claim
      number: 3
      claim_text: KG reasoning systems should use structural information rather than treating a graph as a flat fact store.
      about: [knowledge-graph-question-answering]
      evidence:
        - quote: 'Nevertheless, existing KG-based LLM reasoning methods only treat KGs as factual knowledge bases and overlook the importance of their structural information for reasoning.'

    - work: sciqa
      kind: contribution
      number: 1
      contribution_kind: benchmark
      addresses: [knowledge-graph-question-answering, structured-data-reasoning]
      proposes: [iterative-reading-reasoning]
      uses: [graph-rag]
      evaluates_on: [graphqa]
      reports: [result:sciqa:2]
      evidence:
        - quote: 'Knowledge graphs have gained increasing popularity in the last decade in science and technology.'
    - work: sciqa
      kind: result
      number: 2
      of_method: iterative-reading-reasoning
      on_dataset: graphqa
      with_metric: accuracy
      value: "0.68"
      unit: accuracy
      setting: scholarly question answering
      claims_sota: false
      evidence:
        - quote: 'We present SciQA a scientific QA benchmark for scholarly knowledge.'

    - work: self_rag
      kind: contribution
      number: 1
      contribution_kind: method
      addresses: [hallucination-and-factuality, open-domain-question-answering]
      proposes: [self-reflective-retrieval]
      uses: [retrieval-augmented-generation]
      evaluates_on: [natural-questions]
      reports: [result:self_rag:2]
      addresses_limitation: [limitation:cot:2]
      evidence:
        - quote: 'Despite their remarkable capabilities, large language models (LLMs) often produce responses containing factual inaccuracies due to their sole reliance on the parametric knowledge they encapsulate.'
    - work: self_rag
      kind: result
      number: 2
      of_method: self-reflective-retrieval
      on_dataset: natural-questions
      with_metric: exact-match
      value: "0.86"
      unit: exact match
      setting: open-domain question answering
      claims_sota: true
      evidence:
        - quote: 'Experiments show that Self-RAG (7B and 13B parameters) significantly outperforms state-of-the-art LLMs and retrieval-augmented models on a diverse set of tasks.'
    - work: self_rag
      kind: claim
      number: 3
      claim_text: Fixed retrieval can be harmful when retrieval is unnecessary or irrelevant.
      about: [retrieval-augmented-generation]
      contradicts_claim: [claim:rag:3]
      evidence:
        - quote: 'indiscriminately retrieving and incorporating a fixed number of retrieved passages, regardless of whether retrieval is necessary, or passages are relevant, diminishes LM versatility or can lead to unhelpful response generation.'

    - work: structgpt
      kind: contribution
      number: 1
      contribution_kind: method
      addresses: [structured-data-reasoning, knowledge-graph-question-answering]
      proposes: [iterative-reading-reasoning]
      uses: [chain-of-thought-prompting]
      evaluates_on: [graphqa]
      reports: [result:structgpt:2]
      evidence:
        - quote: 'In this paper, we study how to improve the zero-shot reasoning ability of large language models~(LLMs) over structured data in a unified way.'
    - work: structgpt
      kind: result
      number: 2
      of_method: iterative-reading-reasoning
      on_dataset: graphqa
      with_metric: accuracy
      value: "0.79"
      unit: accuracy
      setting: structured-data question answering
      claims_sota: false
      evidence:
        - quote: "Extensive experiments conducted on three types of structured data demonstrate the effectiveness of our approach, which can significantly boost the performance of ChatGPT"

    - work: think_on_graph
      kind: contribution
      number: 1
      contribution_kind: method
      addresses: [knowledge-graph-question-answering, hallucination-and-factuality]
      proposes: [reasoning-on-graphs]
      uses: [graph-rag]
      evaluates_on: [graphqa]
      reports: [result:think_on_graph:2]
      evidence:
        - quote: 'Although large language models (LLMs) have achieved significant success in various tasks, they often struggle with hallucination problems, especially in scenarios requiring deep and responsible reasoning.'
    - work: think_on_graph
      kind: result
      number: 2
      of_method: reasoning-on-graphs
      on_dataset: graphqa
      with_metric: accuracy
      value: "0.85"
      unit: accuracy
      setting: knowledge-graph reasoning
      claims_sota: true
      evidence:
        - quote: 'As a training-free method with lower computational cost and better generality, ToG achieves overall SOTA in 6 out of 9 datasets where most previous SOTAs rely on additional training.'


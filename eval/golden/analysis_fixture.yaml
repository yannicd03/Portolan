    - work: bert
      kind: contribution
      number: 1
      contribution_kind: method
      addresses: [open-domain-question-answering]
      proposes: [transformer-pretraining]
      uses: [transformer-pretraining]
      evaluates_on: [squad]
      reports: [result:bert:2]

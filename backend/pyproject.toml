[project]
name = "portolan"
version = "0.1.0"
description = "Portolan — bounded literature research into a typed, provenance-carrying knowledge graph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "tenacity>=9.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "rdflib>=7.1",
    "pyoxigraph>=0.4",
    "pyshacl>=0.26",
    "neo4j>=5.25",
    "networkx>=3.4",
    "scipy>=1.14",
    "fastapi>=0.141",
    "uvicorn>=0.54",
    "pypdf>=6.19.0",
    "fonttools>=4.66.0",
    "deepagents>=0.7.19,<0.8",
    "langchain-openai>=1.6.6",
]

[project.scripts]
portolan = "portolan.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["portolan"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "neo4j: requires a running Neo4j instance (spike only)",
    "network: hits a live external API; excluded from the default run",
]

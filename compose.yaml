# Portolan: frontend (nginx + React) -> backend (FastAPI) -> Neo4j.
#
#   docker compose up --build        # web UI on http://localhost:8080
#
# Neo4j is the graph store (ADR-0005). Settings come from .env (gitignored; template in
# .env.example); NEO4J_PASSWORD must be set there. Ports bind to localhost only.
# PORTOLAN_STORE=oxigraph still selects the embedded RDF backend, kept for the spike.

name: portolan

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: portolan-backend:dev
    env_file:
      - path: .env
        required: false
    environment:
      PORTOLAN_STORE: ${PORTOLAN_STORE:-neo4j}
      PORTOLAN_SEED_GOLDEN: ${PORTOLAN_SEED_GOLDEN:-true}
      PORTOLAN_DATA_DIR: /data
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env (see .env.example)}
    volumes:
      - portolan-data:/data
    ports:
      - "127.0.0.1:${PORTOLAN_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: portolan-frontend:dev
    ports:
      - "127.0.0.1:${PORTOLAN_WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  neo4j:
    image: neo4j:2026.09.0-community-trixie
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env (see .env.example)}
      # Not NEO4J_*: the image maps every NEO4J_* variable to a config setting and
      # refuses to start on unknown ones. Only the healthcheck reads this.
      HEALTHCHECK_PASSWORD: ${NEO4J_PASSWORD}
    volumes:
      - neo4j-data:/data
    ports:
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$HEALTHCHECK_PASSWORD\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  portolan-data:
  neo4j-data:
